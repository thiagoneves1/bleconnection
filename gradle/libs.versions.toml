[versions]
agp = "8.13.2"
kotlin = "2.0.21"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2024.09.00"

# --- NEW: versions needed for MVVM + BLE architecture ---
# KSP is the Kotlin Symbol Processing plugin – Hilt uses it to generate DI code at compile time
ksp = "2.0.21-1.0.28"
# Hilt version – Dagger-Hilt provides compile-time dependency injection for ViewModels, repositories, etc.
hilt = "2.56.2"
# Hilt-navigation-compose bridges Hilt DI with Compose Navigation so we can inject ViewModels in composables
hiltNavigationCompose = "1.2.0"
# Kotlin Coroutines – used for all async BLE operations (scanning, connecting, reading GATT characteristics)
coroutines = "1.10.2"
# Lifecycle-runtime-compose gives us collectAsStateWithLifecycle() to safely observe flows in Compose
lifecycleRuntimeCompose = "2.10.0"
# Accompanist Permissions – provides a Compose-friendly API to request BLE runtime permissions
accompanistPermissions = "0.37.3"
# Turbine – small testing library for Kotlin Flows; makes it easy to assert emissions in order
turbine = "1.2.0"
# Coroutines Test – provides TestDispatcher and runTest for controlling virtual time in tests
coroutinesTest = "1.10.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# --- NEW: libraries for MVVM + BLE ---
# Hilt core Android library – provides @HiltAndroidApp, @AndroidEntryPoint, @Inject, @Module, etc.
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
# Hilt annotation processor (KSP) – generates the DI wiring code at compile time
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
# Hilt + Compose Navigation – lets us use hiltViewModel() inside @Composable functions
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
# ViewModel for Compose – survives config changes; holds BLE scan results, connection state, heart-rate data
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeCompose" }
# Lifecycle-runtime-compose – provides collectAsStateWithLifecycle() to observe StateFlow in a lifecycle-aware way
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
# Kotlin Coroutines core – suspend functions, Flow, channels for async BLE operations
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
# Kotlin Coroutines Android – Main dispatcher so coroutines can update UI from BLE callbacks
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Accompanist Permissions – Compose-first permission API; handles BLUETOOTH_SCAN, BLUETOOTH_CONNECT, LOCATION at runtime
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanistPermissions" }
# Turbine – Flow testing library that provides .test{} DSL to collect and assert emissions sequentially
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
# Coroutines Test – TestScope, runTest, StandardTestDispatcher for controlling coroutine execution in unit tests
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# KSP plugin – required by Hilt to process annotations and generate dependency injection code
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Hilt Gradle plugin – sets up Hilt's classpath and transforms for Android dependency injection
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
